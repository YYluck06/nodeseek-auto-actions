name: 账号2 签到

# ─────────────────────────────────────────────────────────────────────────────
# 这个仓库（公开）只放工作流，真正的代码在私有库 YYluck06/nodeseek-auto。
# 一个账号 = 一个工作流文件：账号2.yml / 账号2.yml / 账号3.yml ……
# 变量也按 1/2/3 分开：NS_COOKIE_2 / NS_PROXY_2 / NS_COOKIE_2 / NS_PROXY_2 ……
#
# 需要的 Secrets（Settings → Secrets and variables → Actions）：
#   DEPLOY_KEY     必填  私库的部署密钥（只读+写入，用来取代码、回写 Cookie 状态）
#   CODE_REPO      可选  私库全名，默认 YYluck06/nodeseek-auto
#   NS_COOKIE_2    必填  账号2 的 Cookie：session=xxx; cf_clearance=yyy
#   NS_PROXY_2     可选  账号2 专属代理，如 http://user:pass@host:port
#   NS_STATE_KEY   可选  状态文件加密口令（设了就别改）
#   推送相关：TG_BOT_TOKEN / TG_CHAT_ID / DD_BOT_TOKEN / DD_BOT_SECRET / BARK_URL /
#             SERVERCHAN_KEY / WEBHOOK_URL（填哪个用哪个）
# ─────────────────────────────────────────────────────────────────────────────

on:
  # schedule:
  #   # 填好 NS_COOKIE_2 之后，把下面两行的注释去掉（错开 7 分钟，别和账号1 撞一起）
  #   - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略本地签到记录，强制再查一次（不会重复签到）"
        type: boolean
        default: false

permissions:
  contents: read

# 三个账号共用同一个并发组：绝不并发，既像人，也避免风控按 IP 聚合
concurrency:
  group: nodeseek-signin
  cancel-in-progress: false

jobs:
  signin:
    name: 账号2
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"

      NS_ACCOUNT: "2"
      NS_TRANSPORT: "auto"
      NS_STARTUP_JITTER: "90"
      NS_DELAY_MIN: "3"
      NS_DELAY_MAX: "9"
      NS_FORCE: ${{ inputs.force && '1' || '' }}

      NS_STATE_KEY: ${{ secrets.NS_STATE_KEY }}
      NS_COOKIE_2: ${{ secrets.NS_COOKIE_2 }}
      NS_PROXY_2: ${{ secrets.NS_PROXY_2 }}

      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      DD_BOT_TOKEN: ${{ secrets.DD_BOT_TOKEN }}
      DD_BOT_SECRET: ${{ secrets.DD_BOT_SECRET }}
      BARK_URL: ${{ secrets.BARK_URL }}
      SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

    steps:
      - name: 取代码（私有库 · 部署密钥）
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          CODE_REPO: ${{ secrets.CODE_REPO }}
        run: |
          set -eu
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::error::还没配 DEPLOY_KEY（私库部署密钥）"; exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          REPO="${CODE_REPO:-YYluck06/nodeseek-auto}"
          git clone -q "git@github.com:${REPO}.git" "$GITHUB_WORKSPACE/code"
          cd "$GITHUB_WORKSPACE/code"
          echo "代码版本：$(git log --oneline -1)"

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r code/requirements.txt
          python -c "import curl_cffi, selenium; print('依赖就绪')"

      - name: 体检（失败不阻塞签到）
        continue-on-error: true
        working-directory: code
        run: python tools/doctor.py --account 2 || true

      - name: 执行签到
        # headful 的真实 Chrome 最容易过 Cloudflare 人机挑战，用 xvfb 给个虚拟屏
        working-directory: code
        run: xvfb-run -a --server-args="-screen 0 1280x900x24" python signin.py --account 2

      - name: 把最新 Cookie 存回私库
        if: always()
        working-directory: code
        run: |
          set -u
          git config user.name  "nodeseek-bot"
          git config user.email "nodeseek-bot@users.noreply.github.com"
          if [ -z "$(git status --porcelain state/)" ]; then
            echo "状态文件无变化，跳过提交"; exit 0
          fi
          git add state/
          git commit -q -m "chore(state): 账号2 更新 Cookie ($(date +%F))" || true
          for i in 1 2 3; do
            if git push -q origin HEAD:main; then echo "已回写私库"; exit 0; fi
            git pull --rebase -q origin main || git rebase --abort || true
            echo "推送冲突，5 秒后重试（$i/3）"; sleep 5
          done
          echo "::warning::状态回写失败（多为并发推送），下次运行会自动补上"

      - name: 失败提示
        if: failure()
        run: echo "::error::账号2 运行失败，先看日志；Cookie 失效的话在本机跑 python tools/capture_cookie.py --account 2 重新抓一次"
